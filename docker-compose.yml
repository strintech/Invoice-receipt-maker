services:
  app:
    build: .
    container_name: invoice-receipt-maker
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/db.sqlite
      - UPLOAD_DIR=/app/uploads
      - PDF_TIMEOUT=30000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/templates"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
